<section class="contact-section">
	<div class="contact-intro">
		<h2 class="section-title">Contact</h2>
		<p class="contact-sub">
			Feel free to reach out — whether it's about a project, collaboration, or
			just to connect.
		</p>
	</div>

	<div class="contact-grid">
		<!-- Links -->
		<div class="contact-links">
			<a
				class="contact-card"
				href="https://github.com/alexneilgreen"
				target="_blank"
				rel="noopener"
			>
				<span class="contact-icon">⌥</span>
				<div>
					<p class="contact-card-title">GitHub</p>
					<p class="contact-card-sub">github.com/alexneilgreen</p>
				</div>
			</a>
			<a
				class="contact-card"
				href="https://linkedin.com/in/alexneilgreen"
				target="_blank"
				rel="noopener"
			>
				<span class="contact-icon">in</span>
				<div>
					<p class="contact-card-title">LinkedIn</p>
					<p class="contact-card-sub">linkedin.com/in/alexneilgreen</p>
				</div>
			</a>
			<a class="contact-card" href="mailto:alex@example.com">
				<span class="contact-icon">@</span>
				<div>
					<p class="contact-card-title">Email</p>
					<p class="contact-card-sub">alex@example.com</p>
				</div>
			</a>
		</div>

		<!-- Form (via Formspree — replace action URL) -->
		<div class="contact-form-wrap">
			<div id="contact-form-container">
				<div class="form-row">
					<label for="cf-name">Name</label>
					<input type="text" id="cf-name" placeholder="Your name" />
				</div>
				<div class="form-row">
					<label for="cf-email">Email</label>
					<input type="email" id="cf-email" placeholder="your@email.com" />
				</div>
				<div class="form-row">
					<label for="cf-message">Message</label>
					<textarea
						id="cf-message"
						rows="5"
						placeholder="What's on your mind?"
					></textarea>
				</div>
				<button class="btn-primary" id="cf-submit">Send Message</button>
				<p id="cf-status" class="cf-status"></p>
			</div>
		</div>
	</div>
</section>
